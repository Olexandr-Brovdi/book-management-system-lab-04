[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "book-domain-model"
version = "0.4.0"
description = "Lab 4 variant 2: professional OOP and Python type system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Бровді Олександр"}]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.8"]
report = ["python-docx>=1.1", "Pillow>=10"]

[project.scripts]
book-domain = "book_domain.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
